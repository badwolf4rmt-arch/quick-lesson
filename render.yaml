services:
  - type: web
    name: quick-lesson-i9xq
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Прокси к Supabase — обходит блокировки в РФ, т.к. запрос идёт на домен Render
      - type: rewrite
        source: /sb/*
        destination: https://fahrcihwemfxqlcprupu.supabase.co/:splat
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
