services:
  - type: web
    name: quick-lesson-i9xq
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Прокси только к backend-функциям. Render wildcard подставляется как *.
      - type: rewrite
        source: /api/*
        destination: https://fahrcihwemfxqlcprupu.functions.supabase.co/:splat
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Не кешируем проксированные ответы backend-функций как статический HTML.
      - path: /api/*
        name: Cache-Control
        value: no-store
