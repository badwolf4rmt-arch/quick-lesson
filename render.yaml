services:
  - type: web
    name: quick-lesson-i9xq
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Прокси к backend — обходит блокировки в РФ, т.к. запрос идёт на домен Render
      # Render wildcard подставляется как *, не как :splat.
      - type: rewrite
        source: /sb/*
        destination: https://fahrcihwemfxqlcprupu.supabase.co/*
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Не кешируем проксированные ответы backend-функций как статический HTML.
      - path: /sb/*
        name: Cache-Control
        value: no-store
